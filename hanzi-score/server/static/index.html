<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>田字格小老师</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main>
    <header class="page-head">
      <h1>✍️ 田字格小老师</h1>
    </header>

    <section class="panel">
      <!-- 状态一：选照片 -->
      <div id="step-upload">
        <div id="drop-zone" class="drop-zone" tabindex="0" role="button"
             aria-label="选择或拖入田字格照片">
          <input type="file" id="file-input" accept="image/*" capture="environment"
                 class="visually-hidden">
          <div id="drop-hint" class="drop-hint">
            <span class="drop-icon" aria-hidden="true">📷</span>
            <p>点这里拍照或选照片</p>
          </div>
          <div id="preview-wrap" class="preview-wrap hidden">
            <div class="tianzige"><img id="preview" alt="上传的练习照片"></div>
          </div>
        </div>

        <button id="score-btn" class="btn-primary" type="button" disabled>开始打分</button>

        <p id="file-name" class="file-name hidden"></p>
        <p id="error" class="error hidden" role="alert"></p>
      </div>

      <!-- 状态二：批改结果 -->
      <div id="result" class="hidden" aria-label="批改结果" aria-live="polite">
        <div class="score-line">
          <div id="score-ring" class="score-ring">
            <span id="score-num">0</span><small>/100</small>
          </div>
          <div class="score-side">
            <p id="level-badge" class="level-badge">—</p>
            <p id="char-line" class="char-line"></p>
          </div>
        </div>

        <div id="rewrite" class="rewrite hidden">
          <h3>✏️ 这个字建议再写一遍</h3>
          <p id="rewrite-reason" class="rewrite-reason"></p>
          <p id="rewrite-advice" class="rewrite-advice"></p>
        </div>

        <div id="geometry" class="geometry hidden">
          <div class="compare-row">
            <figure class="compare-cell">
              <img id="geometry-original" class="compare-img" alt="上传的照片">
              <figcaption>你的照片</figcaption>
            </figure>
            <figure class="compare-cell">
              <div id="overlay-stack" class="overlay-stack">
                <img id="geometry-grid" class="compare-img" alt="标准对比（米字格）">
                <img id="geometry-layer-green" class="compare-img layer" alt="">
                <img id="geometry-layer-yellow" class="compare-img layer" alt="">
                <img id="geometry-layer-red" class="compare-img layer" alt="">
                <img id="geometry-ink" class="compare-img layer" alt="标准对比与手写叠加">
                <img id="geometry-cl-green" class="compare-img layer" alt="">
                <img id="geometry-cl-yellow" class="compare-img layer" alt="">
                <img id="geometry-cl-red" class="compare-img layer" alt="">
              </div>
              <figcaption>标准对比</figcaption>
            </figure>
          </div>
          <div id="layer-btns" class="layer-btns" role="group" aria-label="只看某一档笔画">
            <button type="button" data-layer="all" class="active">全部</button>
            <button type="button" data-layer="red">🔴 没写对</button>
            <button type="button" data-layer="yellow">🟡 部分到位</button>
            <button type="button" data-layer="green">🟢 写到位</button>
          </div>
        </div>

        <details id="detail-box" class="detail-box">
          <summary>维度得分与改进点</summary>
          <div id="dims" class="dims"></div>
          <div id="improve-wrap" class="improve hidden">
            <h3>再改这几点</h3>
            <ol id="improvements"></ol>
          </div>
          <ul id="geometry-rows" class="geometry-rows"></ul>
          <p id="meta" class="meta"></p>
        </details>

        <div class="actions">
          <button id="reset-btn" class="btn-secondary hidden" type="button">📷 再写一个字</button>
        </div>
      </div>
    </section>
  </main>

  <script src="static/app.js"></script>
</body>
</html>
