<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动手建造区 - 乘法口诀表</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- 星空背景 -->
  <div class="stars" id="stars"></div>

  <!-- 动手建造区 -->
  <section id="page-builder" class="page active">
    <div class="page-header">
      <h2>动手建造区</h2>
      <button class="btn-help" id="showTutorial" title="怎么玩？">❓</button>
    </div>

    <!-- 挑战横幅 -->
    <div class="challenge-banner" id="challengeBanner" style="display:none;">
      <span class="challenge-icon">🦸</span>
      <span class="challenge-text" id="challengeText"></span>
      <button class="challenge-close" id="closeChallenge">✕</button>
    </div>

    <!-- 建造区主内容 -->
    <div class="builder-layout">
      <!-- 左侧：物品栏 + 操作按钮 -->
      <div class="builder-left">
        <div class="items-shelf" id="itemsShelf">
          <div class="shelf-label">拖拂数字</div>
          <div class="shelf-items" id="shelfItems"></div>
        </div>
        <div class="builder-actions">
          <button class="btn-action btn-clear" id="clearBuilder">清空</button>
          <button class="btn-action btn-challenge" id="randomChallenge">挑战</button>
          <button class="btn-action btn-add-base" id="addBase">+基地</button>
        </div>
      </div>

      <!-- 右侧：超人基地 -->
      <div class="builder-right">
        <div class="bases-hint">拖到基地里</div>
        <div class="bases-container" id="basesContainer"></div>
      </div>
    </div>

    <!-- 结果显示 -->
    <div class="result-bar">
      <div class="result-addition" id="resultAddition"></div>
      <div class="result-multiplication" id="resultMultiplication" style="display:none;"></div>
      <div class="result-chinese" id="resultChinese"></div>
      <button class="btn-commutative" id="btnCommutative" style="display:none;">转一转</button>
    </div>

    <!-- 教程遮罩层 -->
    <div class="tutorial-overlay" id="tutorialOverlay" style="display:none;"></div>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/table.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
